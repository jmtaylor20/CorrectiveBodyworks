[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# gocorrective.com is a second domain for the same practice. Send every
# request on it to the primary domain so search engines see one site.
[[redirects]]
  from = "https://gocorrective.com/*"
  to = "https://correctiverehab.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gocorrective.com/*"
  to = "https://correctiverehab.com/:splat"
  status = 301
  force = true
